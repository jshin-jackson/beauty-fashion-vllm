<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beauty & Fashion AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 헤더 */
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header h1 { font-size: 1.6rem; color: #333; }
    header p  { font-size: 0.9rem; color: #888; margin-top: 4px; }

    /* 상태 표시 */
    #status-bar {
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
      background: #ffeeba;
      color: #856404;
    }
    #status-bar.ok  { background: #d4edda; color: #155724; }
    #status-bar.err { background: #f8d7da; color: #721c24; }

    /* 채팅 컨테이너 */
    #chat-container {
      width: 100%;
      max-width: 700px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      height: 60vh;
    }

    /* 메시지 목록 */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 메시지 버블 */
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-end;
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background: #f3f4f6;
      color: #111;
      border-bottom-left-radius: 4px;
    }
    .message.assistant .token-info {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 6px;
    }
    .message.loading {
      align-self: flex-start;
      background: #f3f4f6;
      color: #9ca3af;
      font-style: italic;
    }

    /* 입력 영역 */
    #input-area {
      padding: 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
    }
    #user-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      resize: none;
    }
    #user-input:focus { border-color: #4f46e5; }
    #send-btn {
      padding: 12px 22px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 24px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #send-btn:hover    { background: #4338ca; }
    #send-btn:disabled { background: #a5b4fc; cursor: not-allowed; }

    /* 예시 질문 버튼 */
    #examples {
      width: 100%;
      max-width: 700px;
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    #examples p { font-size: 0.8rem; color: #888; width: 100%; }
    .example-btn {
      padding: 6px 14px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      font-size: 0.82rem;
      color: #555;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .example-btn:hover { border-color: #4f46e5; color: #4f46e5; }
  </style>
</head>
<body>

  <header>
    <h1>👗 Beauty &amp; Fashion AI</h1>
    <p>vLLM 기반 패션 스타일리스트 챗봇 — Phase 1</p>
  </header>

  <div id="status-bar">서버 연결 확인 중...</div>

  <div id="chat-container">
    <div id="messages">
      <div class="message assistant">
        안녕하세요! 저는 10년 경력의 청담동 패션 스타일리스트예요. ✨<br>
        패션 코디나 뷰티 제품에 대해 무엇이든 물어보세요!
      </div>
    </div>

    <div id="input-area">
      <textarea
        id="user-input"
        placeholder="질문을 입력하세요... (Enter로 전송, Shift+Enter로 줄바꿈)"
        rows="1"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()">전송</button>
    </div>
  </div>

  <!-- 예시 질문 -->
  <div id="examples">
    <p>예시 질문:</p>
    <button class="example-btn" onclick="setExample(this)">
      30대 남성 비즈니스 캐주얼 추천해줘
    </button>
    <button class="example-btn" onclick="setExample(this)">
      지성 피부에 맞는 수분크림 알려줘
    </button>
    <button class="example-btn" onclick="setExample(this)">
      여름 데이트 코디 추천해줘
    </button>
    <button class="example-btn" onclick="setExample(this)">
      2025 봄 패션 트렌드는?
    </button>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl    = document.getElementById("user-input");
    const sendBtn    = document.getElementById("send-btn");
    const statusBar  = document.getElementById("status-bar");

    // ── 서버 상태 확인 ───────────────────────────────────────────
    async function checkHealth() {
      try {
        const res  = await fetch("/api/health");
        const data = await res.json();
        if (data.vllm_connected) {
          statusBar.textContent = `✅ vLLM 연결됨 — 모델: ${data.loaded_models[0] ?? "unknown"}`;
          statusBar.className = "ok";
        } else {
          statusBar.textContent = "⚠️ vLLM 서버 미연결 — start_vllm.sh 를 먼저 실행하세요";
          statusBar.className = "err";
        }
      } catch {
        statusBar.textContent = "❌ FastAPI 서버 연결 실패";
        statusBar.className = "err";
      }
    }
    checkHealth();

    // ── 메시지 전송 ──────────────────────────────────────────────
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      // 사용자 메시지 표시
      appendMessage("user", text);
      inputEl.value = "";
      sendBtn.disabled = true;

      // 로딩 표시
      const loadingEl = appendMessage("loading", "답변 생성 중...");

      try {
        // FastAPI /api/chat 으로 POST 요청
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "서버 오류");
        }

        const data = await res.json();

        // 로딩 제거 후 AI 응답 표시
        loadingEl.remove();
        appendMessage("assistant", data.answer, data.tokens_used);

      } catch (err) {
        loadingEl.remove();
        appendMessage("assistant", `⚠️ 오류: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    // ── 메시지 버블 생성 ─────────────────────────────────────────
    function appendMessage(role, text, tokensUsed) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;

      // AI 응답일 때 토큰 수 표시 (vLLM 학습 목적)
      if (role === "assistant" && tokensUsed) {
        const info = document.createElement("div");
        info.className = "token-info";
        info.textContent = `사용 토큰: ${tokensUsed}개`;
        div.appendChild(info);
      }

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    // ── 예시 질문 클릭 ───────────────────────────────────────────
    function setExample(btn) {
      inputEl.value = btn.textContent.trim();
      inputEl.focus();
    }

    // ── 키보드: Enter 전송, Shift+Enter 줄바꿈 ───────────────────
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>

</body>
</html>
