# Docker Compose — local-m2pro 브랜치 전용
#
# 서비스 구성:
#   vllm-server : vLLM API 서버 (CPU 모드)
#   app         : FastAPI 웹 서버
#
# 실행 방법:
#   docker compose up
#
# 종료 방법:
#   docker compose down

services:

  # ── vLLM 서버 ─────────────────────────────────────────────────
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: beauty-vllm
    # CPU 모드 실행 (M2 Pro는 CUDA GPU 없음)
    command: >
      --model Qwen/Qwen2.5-3B-Instruct
      --device cpu
      --dtype float32
      --max-model-len 4096
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"       # vLLM API 포트
    volumes:
      # 모델 캐시 디렉토리 마운트 (다시 다운로드 방지)
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - HF_HUB_DISABLE_PROGRESS_BARS=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # 모델 로드 시간 고려

  # ── FastAPI 앱 ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beauty-app
    ports:
      - "8080:8080"       # FastAPI 포트
    environment:
      - VLLM_BASE_URL=http://vllm-server:8000/v1  # 컨테이너 간 통신
      - MODEL_NAME=Qwen/Qwen2.5-3B-Instruct
      - APP_PORT=8080
      - MAX_TOKENS=300
      - TEMPERATURE=0.7
    depends_on:
      vllm-server:
        condition: service_healthy  # vLLM 준비 후 앱 시작

# 모델 캐시 볼륨 (컨테이너 재시작 시 모델 재다운로드 방지)
volumes:
  huggingface_cache:
